name: Alpha API cookbook
on: [push, pull_request]
permissions:
  contents: read
jobs:
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check clients/javascript.mjs
      - name: Check native client sources
        run: |
          curl --fail --silent --show-error --location https://curl.se/download/curl-8.12.1.tar.xz -o /tmp/curl.tar.xz
          echo '0341f1ed97a26c811abaebd37d62b833956792b7607ea3f15d001613c76de202  /tmp/curl.tar.xz' | sha256sum --check
          tar -xJf /tmp/curl.tar.xz -C /tmp
          gcc -I/tmp/curl-8.12.1/include -fsyntax-only clients/c/main.c
          g++ -I/tmp/curl-8.12.1/include -fsyntax-only clients/cpp/main.cpp
          javac -d /tmp/sekai-java clients/java/Sekai.java
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path clients/rust/Cargo.toml
